<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chris Argeros</title>
  <link rel="author" href="/humans.txt">
  <script>
    // Apply a saved theme before the page paints, to avoid a flash.
    try {
      var saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f7f3;
      --text: #111111;
      --muted: #888888;
      --link: #1a3fa8;
      --visited: #6b2c91;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #000000;
        --text: #ededed;
        --muted: #777777;
        --link: #8ab4ff;
        --visited: #c3a6ff;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #000000;
      --text: #ededed;
      --muted: #777777;
      --link: #8ab4ff;
      --visited: #c3a6ff;
    }

    /* Fade colours smoothly when the theme changes. */
    *, *::before {
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* Text scales gently with the screen: 16px on phones up to 20px on wide monitors. */
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", "Roboto Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      font-size: clamp(1rem, 0.9rem + 0.4vw, 1.25rem);
      line-height: 1.7;
      overflow-wrap: break-word;
    }

    /* Column width follows the text size, so lines stay a comfortable length. */
    .wrap {
      max-width: 58ch;
      margin: 0 auto;
      padding: clamp(2.5rem, 10vh, 7rem) clamp(1rem, 5vw, 2rem);
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px dashed var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.25rem);
      font-weight: 700;
      line-height: 1.2;
    }

    .toggle {
      flex-shrink: 0;
      padding: 0.25rem;
      background: none;
      border: none;
      font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.25rem);
      line-height: 1;
      cursor: pointer;
      transition: transform 0.2s;
    }

    /* Hover effects only on devices with a mouse, so taps on phones don't leave them stuck on. */
    @media (hover: hover) {
      .toggle:hover { transform: rotate(-15deg) scale(1.1); }
    }

    .toggle.spin { animation: spin 0.5s ease; }

    @keyframes spin {
      from { transform: rotate(-180deg) scale(0.4); opacity: 0; }
      to   { transform: rotate(0) scale(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    h2 {
      margin: 2.5em 0 0.75em;
      font-size: 1em;
      font-weight: 700;
    }

    h2::before { content: "## "; color: var(--muted); }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li::before { content: "- "; color: var(--muted); }

    a { color: var(--link); text-underline-offset: 0.2em; }
    a:visited { color: var(--visited); }

    @media (hover: hover) {
      a:hover { background: var(--link); color: var(--bg); text-decoration: none; }
    }

    li + li { margin-top: 0.15em; }

    li time { color: var(--muted); font-size: 0.85em; }

    footer {
      margin-top: 4em;
      color: var(--muted);
      text-align: center;
    }

    /* Stars twinkle and bob in a gentle wave, one after another. */
    footer .star {
      display: inline-block;
      animation: twinkle 3s ease-in-out infinite;
    }
    footer .star:nth-child(2) { animation-delay: 0.4s; }
    footer .star:nth-child(3) { animation-delay: 0.8s; }

    @keyframes twinkle {
      0%, 60%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      30%           { transform: translateY(-0.3em) scale(1.3); opacity: 1; color: var(--text); }
    }

    footer { user-select: none; }

    /* ~*~ Easter egg: double-click the footer stars for a 2006 profile page ~*~ */
    .ms { display: none; }

    :root.myspace {
      color-scheme: light;
      --bg: #ffffff;
      --text: #000000;
      --muted: #ff3399;
      --link: #0033cc;
      --visited: #6600cc;
    }

    :root.myspace body {
      background-color: #000;
      background-image:
        radial-gradient(#ff66cc 1.5px, transparent 2px),
        radial-gradient(#33ccff 1.5px, transparent 2px),
        radial-gradient(#ffff66 1px, transparent 1.5px);
      background-size: 60px 60px, 90px 90px, 40px 40px;
      background-position: 0 0, 30px 45px, 15px 20px;
      font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive;
    }

    /* A few scattered stars that each twinkle on their own, slow schedule. */
    .twinkles { display: none; }

    :root.myspace .twinkles {
      display: block;
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .twinkles span {
      position: absolute;
      opacity: 0;
      line-height: 1;
      text-shadow: 0 0 6px currentColor;
      animation: twinkle-star ease-in-out infinite;
    }

    @keyframes twinkle-star {
      0%, 80%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      90%           { opacity: 1; transform: scale(1) rotate(45deg); }
    }

    :root.myspace .wrap {
      width: calc(100% - 1.5rem);
      max-width: 64rem;
      margin: clamp(0.75rem, 4vw, 3rem) auto;
      padding: clamp(1rem, 3vw, 2rem);
      background: #fff;
      border: 4px ridge #6699cc;
    }

    /* Wide screens: classic two-column profile, you on the left, blog and links on the right. */
    @media (min-width: 60rem) {
      :root.myspace .wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr);
        grid-template-areas:
          "marquee marquee"
          "header  main"
          "counter counter"
          "footer  footer";
        column-gap: 2.5rem;
      }

      :root.myspace .marquee { grid-area: marquee; }
      :root.myspace header   { grid-area: header; }
      :root.myspace main     { grid-area: main; }
      :root.myspace .counter { grid-area: counter; }
      :root.myspace footer   { grid-area: footer; }

      :root.myspace main .network { margin-top: 0; }
      :root.myspace main section:first-of-type h2 { margin-top: 1.5em; }
    }

    :root.myspace .ms { display: block; }
    :root.myspace .toggle { display: none; }
    :root.myspace .title { border-bottom: 3px dotted #ff3399; }

    :root.myspace h1 {
      background: linear-gradient(90deg, #ff3399, #ff9900, #ffee00, #33cc33, #3399ff, #9933ff, #ff3399);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow 3s linear infinite;
    }

    @keyframes rainbow { to { background-position: 200% center; } }

    :root.myspace h2 {
      padding: 0.1rem 0.5rem;
      background: #6699cc;
      color: #fff;
    }

    :root.myspace h2::before { content: "♥ "; color: #ffccee; }
    :root.myspace li::before { content: "★ "; color: #ff9900; }

    .marquee {
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 1.5rem;
      padding: 0.2rem 0;
      background: #ffccee;
      color: #cc0066;
      font-weight: 700;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 14s linear infinite;
    }

    @keyframes marquee { to { transform: translateX(-100%); } }

    .status { margin: 0.25rem 0 0; font-size: 0.9rem; }
    .online { color: #33cc33; font-weight: 700; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .network {
      margin-top: 1.5rem;
      padding: 0.5rem 0.75rem;
      border: 2px solid #ff9900;
      background: #fff5e6;
      font-weight: 700;
    }

    .counter {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.9rem;
    }

    .counter span {
      padding: 0 0.3rem;
      background: #000;
      color: #33ff33;
      font-family: "Courier New", monospace;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ms marquee"><span>~*~ WeLcOmE 2 mY pAgE!!1 ~*~ thanks 4 the add ~*~ pc4pc? ~*~ double-click the stars 2 go back ~*~</span></div>

    <header>
      <div class="title">
        <h1>Chris Argeros</h1>
        <button class="toggle" type="button" aria-label="Toggle dark mode"></button>
      </div>
      <p>Welcome 👋</p>
      <p class="ms status"><span class="online">Online Now!</span> · Mood: nostalgic 😎</p>
    </header>

    <main>
      <p class="ms network">Chris is in your extended network.</p>

      <section>
        <h2>Blog</h2>
        <ul>
          <!-- posts:start -->
          <li><a href="/blog/hello-world.html">Hello, world</a> <time datetime="2026-11-12">2026-11-12</time></li>
          <!-- posts:end -->
        </ul>
      </section>

      <section>
        <h2>Links</h2>
        <ul>
          <li><a href="https://github.com/charg">GitHub</a></li>
          <li><a href="mailto:chris@syn.sh">Email</a></li>
        </ul>
      </section>
    </main>

    <p class="ms counter">You are visitor # <span id="hits">000000</span></p>

    <footer aria-hidden="true"><span class="star">*</span> <span class="star">*</span> <span class="star">*</span></footer>
  </div>

  <script>
    var root = document.documentElement;
    var button = document.querySelector(".toggle");
    var systemDark = window.matchMedia("(prefers-color-scheme: dark)");

    function isDark() {
      return root.dataset.theme ? root.dataset.theme === "dark" : systemDark.matches;
    }

    function render() {
      // Show the icon for the mode you'll switch to.
      button.textContent = isDark() ? "🌞" : "🌜";
    }

    button.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      render();
      // Restart the spin-in animation for the new icon.
      button.classList.remove("spin");
      void button.offsetWidth;
      button.classList.add("spin");
    });

    systemDark.addEventListener("change", render);
    render();

    // Easter egg: double-click the footer stars to travel back to 2006.
    var pageTitle = document.title;
    var twinkles;

    // Scatter stars across the screen, each with its own pace and start time,
    // so only a few twinkle at once and in different places.
    function makeTwinkles() {
      var colors = ["#ffffff", "#ff66cc", "#33ccff", "#ffff66"];
      twinkles = document.createElement("div");
      twinkles.className = "twinkles";
      twinkles.setAttribute("aria-hidden", "true");
      for (var i = 0; i < 28; i++) {
        var star = document.createElement("span");
        var duration = 5 + Math.random() * 7; // 5–12s per cycle
        star.textContent = "✦";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.fontSize = 10 + Math.random() * 12 + "px";
        star.style.color = colors[i % colors.length];
        star.style.animationDuration = duration + "s";
        star.style.animationDelay = -Math.random() * duration + "s";
        twinkles.appendChild(star);
      }
      document.body.prepend(twinkles);
    }

    document.querySelector("footer").addEventListener("dblclick", function () {
      if (!twinkles) makeTwinkles();
      var on = root.classList.toggle("myspace");
      document.title = on ? "~*~ Chris's Page ~*~" : pageTitle;
      if (on) {
        var n = String(Math.floor(Math.random() * 999999));
        document.getElementById("hits").textContent = ("000000" + n).slice(-6);
      }
    });
  </script>
</body>
</html>
