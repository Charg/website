<header class="site">
      <a class="name" href="/"{{current:home}}><span class="glitch" data-text="chris">chris</span> argeros</a>

        <nav aria-label="Site">
          <a href="/blog/"{{current:blog}}>blog</a>
          <a href="/tools/"{{current:tools}}>tools</a>
        </nav>
        <fieldset class="switch" hidden>
          <legend class="sr-only">Theme</legend>

        </fieldset>
      </div>
