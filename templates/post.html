<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Chris Argeros</title>
  <link rel="author" href="/humans.txt">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/theme.js"></script>
  <script src="/assets/generative.js"></script>
  <script src="/assets/myspace.js" defer></script>
  <style>
    :root { --code-bg: #f0f0ed; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --code-bg: #1a1a1a; }
    }

    :root[data-theme="dark"] { --code-bg: #1a1a1a; }

    .page-head time {
      display: block;
      margin-top: 0.4em;
      font-size: 0.8em;
    }

    time { color: var(--muted); }

    h2, h3 { margin: 2.25em 0 0.6em; font-size: 1.2em; font-weight: 700; line-height: 1.35; }
    h3 { font-size: 1em; color: var(--muted); }

    article :is(ul, ol) { padding-left: 1.5em; }
    article li::marker { color: var(--muted); }
    article li + li { margin-top: 0.25em; }

    img { max-width: 100%; height: auto; }

    code { background: var(--code-bg); padding: 0.1em 0.3em; }
    pre { background: var(--code-bg); padding: 1rem 1.25rem; overflow-x: auto; font-size: 0.9em; line-height: 1.6; }
    pre code { padding: 0; }

    blockquote {
      margin: 2em 0;
      padding-left: 1.25em;
      border-left: 1px solid var(--rule);
      color: var(--muted);
    }

    hr { border: none; border-top: 1px solid var(--rule); margin: 3em 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- include:header -->
    <article>
      <header class="page-head">
        <h1>{{title}}</h1>
        <time datetime="{{date}}">{{date}}</time>
      </header>
{{content}}
    </article>

    <!-- include:footer -->
  </div>
</body>
</html>
