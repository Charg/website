<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Chris Argeros</title>
  <link rel="author" href="/humans.txt">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/theme.js"></script>
  <style>
    :root { --code-bg: #ecebe5; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --code-bg: #1a1a1a; }
    }

    :root[data-theme="dark"] { --code-bg: #1a1a1a; }

    .page-head time {
      display: block;
      margin-top: 0.4em;
      font-size: 0.8em;
    }

    time { color: var(--muted); }

    h2, h3 { margin: 2em 0 0.5em; font-size: 1em; }
    h2::before { content: "## "; color: var(--muted); }
    h3::before { content: "### "; color: var(--muted); }

    img { max-width: 100%; height: auto; }

    code { background: var(--code-bg); padding: 0.1em 0.3em; }
    pre { background: var(--code-bg); padding: 1rem; overflow-x: auto; }
    pre code { padding: 0; }

    blockquote {
      margin: 1.5em 0;
      padding-left: 1em;
      border-left: 2px dashed var(--muted);
      color: var(--muted);
    }

    hr { border: none; border-top: 2px dashed var(--muted); margin: 2.5em 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- include:header -->
    <article>
      <header class="page-head">
        <h1>{{title}}</h1>
        <time datetime="{{date}}">{{date}}</time>
      </header>
{{content}}
    </article>

    <!-- include:footer -->
  </div>
</body>
</html>
