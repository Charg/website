# Run with prek: `prek install` once, or `prek run --all-files`.
# Go tool versions are pinned in server/go.mod; hook revs are bumped by Renovate.
minimum_prek_version: '0.5.0'

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.1
    hooks:
      - id: betterleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # Skipped in CI (no Nix on the runner); comes from the devShell locally.
      - id: nixfmt
        name: nixfmt
        language: system
        entry: nixfmt
        files: \.nix$
      - id: gofmt
        name: gofmt
        language: system
        entry: gofmt -l -w
        types: [go]
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: sh -c 'cd server && go mod tidy -diff'
        files: ^server/go\.(mod|sum)$
        pass_filenames: false
      - id: go-vet
        name: go vet
        language: system
        entry: sh -c 'cd server && go vet ./...'
        files: ^server/.*\.go$
        pass_filenames: false
      - id: staticcheck
        name: staticcheck
        language: system
        entry: sh -c 'cd server && go tool staticcheck ./...'
        files: ^server/.*\.go$
        pass_filenames: false
      - id: govulncheck
        name: govulncheck
        language: system
        entry: sh -c 'cd server && go tool govulncheck ./...'
        files: ^server/(.*\.go|go\.(mod|sum))$
        pass_filenames: false
