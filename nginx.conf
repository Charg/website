# Replaces the image's /etc/nginx/conf.d/default.conf.
#
# HSTS and X-Content-Type-Options are added by Cloudflare (infra repo,
# cloudflare/zone-security.tf), so they aren't set here.
#
# nginx gotcha: a `location` block with any add_header of its own drops every
# add_header inherited from this server block. Repeat the headers if you add one.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Generated by build.js (inline script hashes).
    include /etc/nginx/csp.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
